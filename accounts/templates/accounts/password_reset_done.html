{% extends "accounts/base.html" %}
{% block title %}Check your email{% endblock %}
{% block content %}
  <section class="auth-card reset-card">
    <h1>CHECK YOUR EMAIL</h1>
    <p class="helper-text">If an account matches that email, a reset link has been sent. In local development, check the terminal running Django.</p>
    <a class="submit-button button-link" href="{% url 'login' %}">Back to Login</a>
  </section>
{% endblock %}
