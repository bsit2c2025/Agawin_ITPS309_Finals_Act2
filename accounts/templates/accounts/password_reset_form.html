{% extends "accounts/base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
  <section class="auth-card reset-card">
    <h1>RESET PASSWORD</h1>
    <p class="helper-text">Enter your account email and we’ll prepare a password reset link.</p>
    <form method="post">
      {% csrf_token %}
      <div class="field-wrap">
        <input id="reset-email" name="email" type="email" placeholder=" " autocomplete="email" required>
        <label for="reset-email">Email</label>
      </div>
      <button class="submit-button" type="submit">Send reset link</button>
    </form>
  </section>
  <a class="below-link" href="{% url 'login' %}">Back to Login</a>
{% endblock %}
